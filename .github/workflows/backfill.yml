name: Historical Backfill

on:
  workflow_dispatch:
    inputs:
      days:
        description: 'Number of days to backfill (shorthand, ignored if start/end provided)'
        required: false
        default: '60'
        type: string
      start_date:
        description: 'Start date (YYYY-MM-DD)'
        required: false
        type: string
      end_date:
        description: 'End date (YYYY-MM-DD)'
        required: false
        type: string
      city:
        description: 'City ID to backfill (leave empty for all cities)'
        required: false
        type: string

jobs:
  run-backfill:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run backfill
        env:
          AQICN_API_KEY: ${{ secrets.AQICN_API_KEY }}
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
          HOPSWORKS_PROJECT_NAME: ${{ secrets.HOPSWORKS_PROJECT_NAME }}
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.start_date }}" ] && [ -n "${{ github.event.inputs.end_date }}" ]; then
            ARGS="--start-date ${{ github.event.inputs.start_date }} --end-date ${{ github.event.inputs.end_date }}"
          elif [ -n "${{ github.event.inputs.days }}" ]; then
            ARGS="--days ${{ github.event.inputs.days }}"
          fi
          if [ -n "${{ github.event.inputs.city }}" ]; then
            ARGS="$ARGS --city ${{ github.event.inputs.city }}"
          fi
          python -m src.backfill.run_backfill $ARGS
