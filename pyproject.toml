[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "pearls-aqi-predictor"
version = "1.0.0"
description = "A 100% serverless, end-to-end ML system that forecasts AQI for the next 3 days"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
